name: Release

# Runs after release-please pushes a version tag (vX.Y.Z) for a release it
# just created. GoReleaser cross-compiles controldctl and attaches the
# binaries to that same GitHub release; see .goreleaser.yaml.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up mise (Go)
        uses: jdx/mise-action@v4
        with:
          install_args: go

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
